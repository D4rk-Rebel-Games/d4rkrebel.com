<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">D4rk Rebel Games — Folded Hood</title>
  <desc id="logo-description">A geometric folded hood in deep teal and dark ink. The open face and angular fold suggest a hidden 4. Transparent background; editable vector paths.</desc>
